<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmAIltalk</title>
    <!--
      **配られる CSS の集合は2本である**(ADR-0088 限定2 / 限定6)。**並びは
      「生成 → 手書き」で、web/src/main.tsx と同じである。**

      **既存のエントリは TypeScript の import で読み込むが、こちらは HTML の link で
      読み込む。** 理由は web/test/style-sources.test.ts の (集合2) が
      「TypeScript から import される CSS は全部で2本」と**本数**で固定しており、
      2本目のエントリが同じ2本を import すると4本になって赤くなるためである。
      **その検査を書き換えないことを選んだ。** **代償**: (集合2) はこのエントリの
      CSS の読み込みを1本も見ていない(集合そのものの全量性は (集合1) が
      web/src 配下の .css を数えて見ているので、そちらは今日も効く)。
      **この経緯は docs/plan/v5/records/v5-m4.md §1 に書いてある。**
    -->
    <link rel="stylesheet" href="/src/tailwind.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!--
      **どのアプリを表示するかは、ビルド時に環境変数 GP_RUNNER_APP_ID で与える**
      (V5-M4-T01。置き換えは web/vite.config.ts の runner モードの define)。
      **DOM の属性では渡さない** —— ADR-0050 限定5(アプリ固有のセレクタを書く手段を
      作らない)と web/test/preset-boundary.test.ts の (iv) がそれを禁じている。
      **与えずにビルドすると、画面は黙って白くならずに「与えられていない」と書く。**
    -->
    <div id="root"></div>
    <script type="module" src="/src/runner-main.tsx"></script>
  </body>
</html>
